<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t">
  <title id="t">ภาพจำลองป้ายฐานโบราณสถาน พระราชวังจันทน์</title>
  <defs>
    <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#a4553a"/>
      <path d="M0 0.5 H40 M0 10.5 H40 M20 0 V10 M0 10 V20 M40 10 V20" stroke="#7d3c27" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="520" fill="#cfd8c4"/>
  <rect x="0" y="420" width="800" height="100" fill="url(#brick)"/>
  <rect x="80" y="40" width="640" height="370" rx="10" fill="#4b2f1f"/>
  <rect x="98" y="58" width="604" height="334" rx="6" fill="#f3ead6"/>
  <rect x="110" y="70" width="580" height="310" rx="4" fill="none" stroke="#8a5a2b" stroke-width="2"/>
  <g font-family="'IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif" fill="#2a1a10" text-anchor="middle">
    <text x="400" y="126" font-size="40" font-weight="700" fill="#6b2e17">พระราชวังจันทน์</text>
    <text x="400" y="172" font-size="24" font-weight="600">สถานที่เสด็จพระราชสมภพ</text>
    <text x="400" y="208" font-size="24" font-weight="600">สมเด็จพระนเรศวรมหาราช พ.ศ. ๒๐๙๘</text>
    <text x="400" y="252" font-size="21">แนวฐานกำแพงอิฐและฐานอาคารโบราณ</text>
    <text x="400" y="286" font-size="21">ขุดแต่งและบูรณะโดยกรมศิลปากร</text>
    <text x="400" y="340" font-size="20" fill="#6b2e17">ศาลสมเด็จพระนเรศวรมหาราช</text>
  </g>
</svg>
